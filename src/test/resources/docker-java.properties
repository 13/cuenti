# Testcontainers' bundled docker-java defaults to Docker API 1.32, which
# Docker 29+ refuses ("client version 1.32 is too old. Minimum supported
# API version is 1.40"). The Postgres integration tests then report
# "Could not find a valid Docker environment" and are silently SKIPPED --
# which is how a Postgres-only regression slips through a green build.
api.version=1.44

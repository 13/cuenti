name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Tag builds run one at a time; the latest-tag check below decides who moves `latest`
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  # ghcr.io on GitHub, the Gitea container registry when run on Gitea
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'gitea.muh' }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Only the highest v* tag may move `latest` and the major.minor tag, so a
      # slower or re-run build of an older tag can't overwrite them
      - name: Check if this is the latest version
        id: check
        run: |
          highest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" = "${highest}" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=${GITHUB_REF_NAME} highest=${highest}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ github.server_url == 'https://github.com' && 'docker-container' || 'docker' }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.check.outputs.is_latest }}
            type=raw,value=latest,enable=${{ steps.check.outputs.is_latest }}
            type=raw,value=ci-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

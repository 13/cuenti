name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # ghcr.io on GitHub, the Gitea container registry when run on Gitea
  REGISTRY: ${{ github.server_url == 'https://github.com' && 'ghcr.io' || 'gitea.muh' }}
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ github.server_url == 'https://github.com' && 'docker-container' || 'docker' }}

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=ci-${{ github.sha }},enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      # On Gitea, buildx's single-shot `--push` uses BuildKit's own registry
      # client, which does not read /etc/docker/certs.d and fails TLS
      # verification against the self-signed gitea.muh registry even with
      # the docker driver. Build and load into the daemon instead, then push
      # with the classic `docker push`, which does honor /etc/docker/certs.d.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.server_url == 'https://github.com' }}
          load: ${{ github.server_url != 'https://github.com' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Push images (Gitea)
        if: github.server_url != 'https://github.com'
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
